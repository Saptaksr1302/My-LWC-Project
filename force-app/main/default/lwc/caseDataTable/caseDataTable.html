<template>
    <lightning-card title="My Cases" icon-name="utility:case">
        <!-- <div class="datatable-header">
            <lightning-button
                label="Add Codes"

            </lightning-button>
        </div> -->
        <div class="slds-m-around_medium">
            <lightning-datatable
                key-field="Id"
                data={cases}
                columns={columns}
                draft-values={draftValues}
                onrowaction={handleRowAction}
                onsave={handleSave}
                hide-checkbox-column="true"
                class="custom-datatable">
            </lightning-datatable>
        </div>
    </lightning-card>

    <!-- MODAL for Case Code Selection -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header custom-modal-header">
                    <h2 class="slds-modal__title custom-modal-title">Assign Case Codes to Case No - {selectedCaseNumber}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <!-- <template if:true={showError}>
                        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                            <span class="slds-assistive-text">Error</span>
                            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Error">
                                <lightning-icon icon-name="utility:error" alternative-text="Error" size="small"></lightning-icon>
                            </span>
                            <h2>Please select at least one Case Code to proceed.</h2>
                        </div>
                    </template> -->
                    <template if:true={showError}>
                        <div class="error-message">
                            <span class="error-text">⚠️ Please select at least one Case Code to proceed.</span>
                        </div>
                    </template>

                    <lightning-datatable
                        key-field="Id"
                        data={caseCodes}
                        columns={codeColumns}
                        onrowselection={handleCodeSelection}>
                    </lightning-datatable>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleSaveCodes}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
